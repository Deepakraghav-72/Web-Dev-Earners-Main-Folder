<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table,
        tr,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
   
    <table>
        <tr>
            <th colspan="6">Time Table</th>
        </tr>

        <tr>
            <td rowspan="7">Hour</td>
            <th>mon</th>
            <th>tue</th>
            <th>wed</th>
            <th>thur</th>
            <th>fri</th>
        </tr>
        <tr>

            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>
            <td>Maths</td>
            <td>Art</td>
        </tr>
        <tr>

            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>
            <td>Maths</td>
            <td>Art</td>
        </tr>
        <tr>

            <th colspan="6">Lunch</th>
        </tr>
        <tr>

            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>
            <td>Maths</td>
            <td rowspan="2">Project</td>
        </tr>
        <tr>

            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>
            <td>Maths</td>

        </tr>
    </table>
   



   

</body>

</html>
